  :root{ --ink:#e8ebe6; --dim:rgba(232,235,230,.5); --sun:#f4d68b; --deep:#050a07; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--deep)}
  body{
    font-family:QQSong,"Songti SC","Noto Serif SC","Hiragino Mincho ProN",serif;
    color:var(--ink);display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:relative;height:100dvh;width:calc(100dvh * 1260 / 2240);
    max-width:100vw;max-height:calc(100vw * 2240 / 1260);
    overflow:hidden;background:#08110b;cursor:crosshair;touch-action:none;
  }

  #scene{position:absolute;inset:0;transition:transform 3.2s cubic-bezier(.22,.9,.24,1);will-change:transform}
  #photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    transition:filter 2.4s ease;will-change:filter}
  /* the lit cone: same photo, brighter, revealed only through a soft round mask */
  #spot{position:absolute;inset:0;background-size:cover;background-position:center;
    filter:brightness(1.13) saturate(1.06);
    opacity:0;transition:opacity 1.8s ease;pointer-events:none;will-change:opacity}
  #vignette{position:absolute;inset:-25%;opacity:0;transition:opacity 2.8s ease;pointer-events:none}

  .ring{
    position:absolute;border-radius:50%;transform:translate(-50%,-50%);
    border:1px solid rgba(244,214,139,.22);opacity:0;pointer-events:none;
  }
  .ring.pulse{animation:breathe 3.4s ease-in-out infinite}
  .ring.mark{opacity:.5;border-color:rgba(244,214,139,.45)}
  @keyframes breathe{0%,100%{opacity:0;transform:translate(-50%,-50%) scale(.82)}
                     50%{opacity:.5;transform:translate(-50%,-50%) scale(1.06)}}

  #flock{position:absolute;inset:0;pointer-events:none;opacity:1;transition:opacity 1.5s ease}
  #flock span{position:absolute;left:0;top:0;display:block;white-space:pre;
    text-shadow:0 1px 5px rgba(0,0,0,.9),0 0 20px rgba(0,0,0,.65);will-change:transform,opacity}
  #probe{position:absolute;visibility:hidden;pointer-events:none;left:9%;right:9%}
  #probe .para{text-align:justify;text-justify:inter-ideograph}
  #probe .para span{display:inline-block}
  #probe .cap{letter-spacing:.14em;opacity:.001}

  #scrim{position:absolute;left:0;right:0;opacity:0;transition:opacity 2.2s ease;pointer-events:none}
  #caption{position:absolute;left:9%;right:9%;opacity:0;transition:opacity 1.6s ease;color:var(--dim)}
  #caption b{display:block;font-weight:400;color:var(--ink);letter-spacing:.22em;line-height:1.5}
  #caption i{display:block;font-style:italic;opacity:.6;letter-spacing:.06em;margin-top:.5em}

  /* the twist line, flashed large in the middle of the frame */
  #flash{position:absolute;left:8%;right:8%;top:47%;transform:translateY(-50%);
    text-align:center;font-size:clamp(20px,5vh,26px);letter-spacing:.18em;text-indent:.18em;
    color:#fff3d2;text-shadow:0 2px 14px rgba(0,0,0,.98),0 0 34px rgba(0,0,0,.85);
    opacity:0;pointer-events:none;transition:opacity 1s ease}
  #flash.on{opacity:1}

  /* a round viewfinder that rides above the fingertip while scanning */
  #loupe{position:absolute;left:0;top:0;border-radius:50%;
    background-repeat:no-repeat;box-shadow:0 6px 26px rgba(0,0,0,.75),
    inset 0 0 0 1px rgba(240,243,238,.55), inset 0 0 26px rgba(0,0,0,.4);
    opacity:0;transition:opacity .22s ease;pointer-events:none;will-change:transform}
  #loupe.on{opacity:1}
  #loupe::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;
    margin:-4.5px 0 0 -4.5px;border-radius:50%;
    box-shadow:0 0 0 1px rgba(255,255,255,.75),0 0 6px rgba(0,0,0,.9)}

  #toast{position:absolute;left:50%;bottom:34%;max-width:84%;transform:translateX(-50%);
    font-size:clamp(12px,3vh,14px);letter-spacing:.14em;color:rgba(240,243,238,.97);
    background:rgba(4,9,6,.82);padding:.7em 1.4em;border-radius:2em;
    opacity:0;pointer-events:none;transition:opacity .5s ease;
    word-break:break-all;line-height:1.7;z-index:12}
  #toast.on{opacity:1}

  .bar{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;
    gap:.9em;font-size:clamp(13px,3.2vh,15px);letter-spacing:.14em;color:rgba(240,243,238,.97);
    text-shadow:0 1px 8px rgba(0,0,0,1),0 0 26px rgba(0,0,0,.9);pointer-events:none;
    opacity:0;transition:opacity 1.1s ease;text-align:center;padding:0 8%}
  .bar.show{opacity:1}
  #topbar{top:0;padding:calc(max(2.6vh,env(safe-area-inset-top)) + .2em) 8% 2.2em;
    background:linear-gradient(to bottom,rgba(4,9,6,.65) 24%,rgba(4,9,6,0))}
  #topline{font-size:clamp(9px,2.1vh,11px);letter-spacing:.08em;
    color:rgba(240,243,238,.70);text-shadow:0 1px 5px rgba(0,0,0,.8)}
  #botbar{bottom:0;padding:3.4em 8% calc(max(3.2vh,env(safe-area-inset-bottom)) + .4em);
    background:linear-gradient(to top,rgba(4,9,6,.78) 34%,rgba(4,9,6,0))}
  .act{pointer-events:auto;cursor:pointer;font:inherit;letter-spacing:.14em;color:rgba(240,243,238,.97);
    background:none;border:0;border-bottom:1px solid rgba(240,243,238,.4);padding-bottom:.28em;
    transition:color .4s,border-color .4s}
  .act:hover,.act:focus-visible{color:var(--ink);border-color:rgba(232,235,230,.6)}

  #intro{position:absolute;inset:0;z-index:9;background:linear-gradient(rgba(4,9,6,.52),rgba(4,9,6,.88));
    backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2.8em;text-align:center;transition:opacity 1s ease;padding:0 10%}
  #intro p{font-size:clamp(19px,4.6vh,25px);line-height:2.1;color:rgba(240,243,238,.97);
    letter-spacing:.06em;text-shadow:0 1px 10px rgba(0,0,0,.9)}
  #enter{font:inherit;font-size:clamp(13px,3.2vh,15px);letter-spacing:.34em;text-indent:.34em;
    color:var(--sun);background:none;border:0;border-bottom:1px solid rgba(244,214,139,.4);
    padding:.5em .2em .45em;cursor:pointer;transition:color .5s,border-color .5s}
  #enter:hover{color:#fff0c4;border-color:var(--sun)}

  #end{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2em;text-align:center;padding:0 11%;opacity:0;pointer-events:none;
    transition:opacity 1.8s ease;background:none}
  #end.show{opacity:1;pointer-events:auto;cursor:pointer}
  #end .block{display:flex;flex-direction:column;align-items:center;gap:1.6em}
  #end .acts{position:absolute;left:0;right:0;bottom:max(6vh,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:1.35em}
  #share2{font:inherit;font-size:clamp(14px,3.4vh,16px);letter-spacing:.18em;
    color:var(--sun);text-shadow:0 1px 10px rgba(0,0,0,.95);
    background:none;border:0;border-bottom:1px solid rgba(244,214,139,.5);
    padding-bottom:.32em;cursor:pointer;transition:color .4s,border-color .4s}
  #share2:hover{color:#fff0c4;border-color:var(--sun)}
  #end .title{display:block;width:min(84%,350px);height:auto;
    filter:drop-shadow(0 2px 16px rgba(0,0,0,.9))}
  #end .by{font-size:clamp(13px,3.2vh,15px);letter-spacing:.26em;color:rgba(240,243,238,.9);
    text-shadow:0 1px 10px rgba(0,0,0,.95)}
  #again{font:inherit;font-size:clamp(13px,3.1vh,15px);letter-spacing:.2em;
    color:rgba(240,243,238,.95);text-shadow:0 1px 10px rgba(0,0,0,.95);
    background:none;border:0;border-bottom:1px solid rgba(240,243,238,.42);
    padding-bottom:.3em;cursor:pointer;transition:color .4s,border-color .4s;margin-top:.6em}
  #again:hover{color:#fff;border-color:#fff}

  @media (prefers-reduced-motion:reduce){
    #scene{transition-duration:.01ms}
    .ring.pulse{animation:none;opacity:.4}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="scene">
    <img id="photo" alt="" src="">
    <div id="spot"></div>
    <div id="marks"></div>
    <div id="vignette"></div>
  </div>
  <div id="scrim"></div>
  <div id="flock"></div>
  <div id="probe" aria-hidden="true"></div>
  <div id="caption"></div>

  <div id="flash"></div>
  <div class="bar" id="topbar"><span id="topline"></span></div>
  <div class="bar" id="botbar"><span id="hintline"></span><span id="slot"></span></div>
  <div id="loupe"></div>
  <div id="toast"></div>

  <div id="intro">
    <p id="introline">你能找出照片里的鸟么？<br>请打开声音</p>
    <button id="enter">进林子</button>
  </div>

<script>
(() => {
"use strict";

const LEVELS = {"dollarbird": {"cn": "三宝鸟", "sci": "Eurystomus orientalis", "credit": "薄顺奇", "birds": [{"x": 0.8067, "y": 0.6401, "hit": [0.06, 0.06]}], "textBand": [0.0, 0.53], "text": "那蓝绿紫的羽毛上，流泛着——没错，琉璃般的光泽。这种结构色是阳光的折射使然——它们并非固有的颜色，而是与光共生的显现。很巧，这种属性正好呼应了佛教的“空性”与“缘起”：一切显像，皆是因缘际会的结果。——《空海的三宝鸟》"}, "bee-eater": {"cn": "蓝喉蜂虎", "sci": "Merops viridis", "credit": "Ding Li Yong", "zoomOn": "last", "birds": [{"x": 0.6109, "y": 0.2378, "hit": [0.06, 0.06]}, {"x": 0.5514, "y": 0.8294, "hit": [0.06, 0.06], "cu": "bee-eater-flip"}], "textBand": [0.348, 0.719], "text": "每个巢穴都是一个代表时间的数字，里面都藏着故事。或许是孵化的期待，或许是幼鸟尝试飞翔的瞬间，又或许是一个生命结束的悲鸣，在人类的目光之外悄然进行着。——《确定时刻》"}, "spotted-dove": {"cn": "珠颈斑鸠", "sci": "Spilopelia chinensis", "credit": "小菜鸟", "dim": 0.24, "missAt": 3, "missMsg": "真相总在阴影里", "birds": [{"x": 0.273, "y": 0.924, "hit": [0.07, 0.07]}], "textBand": [0.0, 0.8], "text": "在这些微妙的起伏中，地球在与你交流它的呼吸，你能感受到地球的脉搏。你并不知道这些感受来自哪里，但你依赖它们，就像船长依赖星辰。——《鸠心事》"}, "brambling": {"cn": "燕雀", "sci": "Fringilla montifringilla", "credit": "薄顺奇", "dim": 0.28, "zoomOn": "lowest", "birds": [{"x": 0.403, "y": 0.464, "hit": [0.065, 0.065]}, {"x": 0.643, "y": 0.508, "hit": [0.065, 0.065]}, {"x": 0.626, "y": 0.712, "hit": [0.065, 0.065]}], "textBand": [0.0, 0.352], "text": "鸟儿路经千里，横渡冬夏，翻越山河，聚散离合。而我站在住宅楼宇和烟火日常之间，望着它们暂歇的身影和吃剩的果实，脚下长出了一条通向辽远世界的幻想路径。——《燕雀之志》"}, "treecreeper": {"cn": "旋木雀", "sci": "Certhia familiaris", "credit": "薄顺奇", "birds": [{"x": 0.5597, "y": 0.3933, "hit": [0.07, 0.15]}], "textBand": [0.503, 1.0], "text": "十八世纪的法国博物学家布冯在他的《博物志》里，觉得旋木雀应该被称为“攀爬啄木鸟”（Pic-Grimpereau），因为它们的特点介于啄木鸟与鹪鹩之间。它们常在大树主干上活动，以坚韧的尾羽提供支撑，用细小如镊的尖喙，啄食藏匿于树皮裂缝里和苔藓之间的节肢动物。——《大雨落在山间》"}, "red-tailed-robin": {"cn": "红尾歌鸲", "sci": "Larvivora sibilans", "credit": "薄顺奇", "birds": [{"x": 0.7266, "y": 0.5384, "hit": [0.09, 0.09]}], "textBand": [0.0, 0.428], "text": "你要找的，是一只典型的LBB（Little Brown Bird）——鸟人们爱恨交织之中带着几分自嘲创造的名词……它们外貌朴素，羽色单调，轮廓简单，总是隐没于林下背景。它们的相似性几乎是一种幽默，每一只都像是前一只的翻版，让人既怀疑自己的眼睛，又无法放弃一探究竟。——《四访园山》"}, "scops-owl": {"cn": "西红角鸮", "sci": "Otus scops", "credit": "Shuangqi Liu", "dim": 0.15, "birds": [{"x": 0.2398, "y": 0.5587, "hit": [0.065, 0.105]}], "textBand": [0.0, 0.449], "text": "深黑瞳孔与明黄虹膜分明清澈，映着余晖，仿佛两粒凝住夕阳的琥珀。它微微张嘴，胸腹鼓动，鸣声在空气中跳跃，像是在催促着黄昏的落幕。——《成为猫头鹰》"}};
const SRC = {"dollarbird": "levels/dollarbird.webp", "bee-eater": "levels/bee-eater.webp", "spotted-dove": "levels/spotted-dove.webp", "brambling": "levels/brambling.webp", "treecreeper": "levels/treecreeper.webp", "red-tailed-robin": "levels/red-tailed-robin.webp", "scops-owl": "levels/scops-owl.webp"};              // key -> image url (or data uri)

function measure(){
  const r = stage.getBoundingClientRect();
  W = r.width; H = r.height;

  const [lo,hi] = L.textBand;
  const bandTop = lo*H, bandH = (hi-lo)*H;
  const inner  = W*0.82;

  const FMAX = Math.min(W*0.043, 20), FMIN = Math.min(W*0.034, 15);
  let fs = FMAX, best = FMIN;
  for (fs = FMAX; fs >= FMIN; fs -= 0.4){
    probe.style.fontSize = fs+"px";
    probe.innerHTML =
      '<div class="cap">'+CAPHTML(fs,"x","x","x")+'</div>' +
      '<div class="para" style="line-height:2.02;margin-top:'+(fs*0.9)+'px">'+L.text+'</div>';
    if (probe.offsetHeight <= bandH*0.86){ best = fs; break; }
  }
  fs = best;
  probe.style.fontSize = fs+"px";
  probe.innerHTML =
    '<div class="cap">'+CAPHTML(fs,L.cn,L.sci,null)+'</div>' +
    '<div class="para" style="line-height:2.02;margin-top:'+(fs*0.9)+'px">' +
    [...L.text].map(c => "<span>"+(c===" "?"&nbsp;":c)+"</span>").join("") + '</div>';

  const top = bandTop + Math.max(0,(bandH - probe.offsetHeight))/2;
  probe.style.top = top+"px";

  const sr = stage.getBoundingClientRect();
  const cr = probe.querySelector(".cap").getBoundingClientRect();
  capRect = {top: cr.top - sr.top};
  cap.style.top = capRect.top+"px";
  cap.dataset.fs = fs;

  scrim.style.top    = Math.max(0, top - fs*4)+"px";
  scrim.style.height = (probe.offsetHeight + fs*8)+"px";
  scrim.style.background =
    "linear-gradient(to bottom,rgba(4,9,6,0) 0%,rgba(4,9,6,.9) 22%,rgba(4,9,6,.9) 78%,rgba(4,9,6,0) 100%)";

  return fs;
}

function build(){
  const fs = measure();
  const sr = stage.getBoundingClientRect();
  flock.innerHTML = ""; chars = [];
  [...probe.querySelectorAll(".para span")].forEach((p,i) => {
    const b = p.getBoundingClientRect();
    const s = document.createElement("span");
    s.textContent = L.text[i];
    s.style.fontSize = fs+"px";
    flock.appendChild(s);
    chars.push({
      el:s, tx:b.left-sr.left, ty:b.top-sr.top,
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-.5)*.9, vy:(Math.random()-.5)*.9,
      ph:Math.random()*6.28, sp:.55+Math.random()*.75,
      rot:(Math.random()-.5)*38, sc:.8+Math.random()*.5, op:.32+Math.random()*.5,
      sx:0,sy:0,srot:0,ssc:1,sop:1,delay:0
    });
  });

  marks.innerHTML = "";
  birds.forEach(b => {
    const ring = document.createElement("div"); ring.className="ring";
    ring.style.left = (b.x*100)+"%"; ring.style.top = (b.y*100)+"%";
    ring.style.width  = (b.hit[0]*W*2.3)+"px"; ring.style.height = (b.hit[1]*W*2.3)+"px";
    marks.append(ring);
    b.ring = ring;
  });
}

/* ── stage light: bird brightens, everything else drops ────── */
function relight(all){
  let lit = birds.filter(b=>b.found);
  if (!lit.length) return;
  if (L.zoomOn === "last")   lit = [lit.reduce((a,b)=> (b.seq>a.seq ? b : a))];
  if (L.zoomOn === "lowest") lit = [lit.reduce((a,b)=> (b.y  >a.y   ? b : a))];
  const k = L.light || 1;                      // per-level cone size
  const g = L.glow  || 1;                      // per-level cone brightness
  spot.style.filter = `brightness(${(1+0.13*g).toFixed(3)}) saturate(${(1+0.06*g).toFixed(3)})`;
  const r1 = W*0.10*k, r2 = W*0.24*k;
  const cone = lit.map(b =>
    `radial-gradient(circle at ${(b.x*100).toFixed(2)}% ${(b.y*100).toFixed(2)}%,`+
    `#000 0,#000 ${r1.toFixed(0)}px,rgba(0,0,0,0) ${r2.toFixed(0)}px)`).join(",");
  spot.style.webkitMaskImage = cone;
  spot.style.maskImage = cone;
  if (L.cu){                                   // a sharper view, one layer per bird
    const f = W/1260, S = 700*f;
    spot.style.backgroundImage    = lit.map(b=>"url("+(CLOSEUP[b.cu]||L.cu)+")").join(",");
    spot.style.backgroundSize     = lit.map(()=>S.toFixed(1)+"px "+S.toFixed(1)+"px").join(",");
    spot.style.backgroundRepeat   = lit.map(()=>"no-repeat").join(",");
    spot.style.backgroundPosition = lit.map(b =>
      (b.x*W-S/2).toFixed(1)+"px "+(b.y*H-S/2).toFixed(1)+"px").join(",");
  }
  spot.style.opacity = "1";
  // partial find keeps the room readable so the second bird is still findable
  const d = L.dim || .36;                      // per-level surround darkness
  // with birds still out there, leave the photo alone — only mark the one found
  photo.style.filter = all ? `brightness(${d}) saturate(.7) contrast(1.03)` : "none";
}
function darkOff(){
  spot.style.opacity = "0";
  photo.style.filter = "none";
}

/* ── audio: one voice per species, all synthesised ─────────── */
// reps/repGap apply to the recording; kind/f/n/dur are the synth fallback
const VOICE = {
  "dollarbird":       {kind:"rasp",    f:[820,1250], n:3,  gap:.17, dur:.10, every:[2400,1600], reps:3, repGap:.19},
  "bee-eater":        {kind:"roll",    f:[2100,2950],n:2,  gap:.24, dur:.14, every:[2000,1400], reps:2, repGap:.31},
  "treecreeper":      {kind:"thin",    f:[6200,8200],n:6,  gap:.085,dur:.045,every:[1900,1300]},
  "red-tailed-robin": {kind:"trill",   f:[4000,5400],n:17, gap:.046,dur:.038,every:[4600,1900]},
  "scops-owl":        {kind:"whistle", f:[1160,1180],n:1,  gap:.6,  dur:.34, every:[2700,700]},
  "spotted-dove":     {kind:"whistle", f:[620,700],  n:3,  gap:.28, dur:.22, every:[2500,900]},
  "brambling":        {kind:"roll",    f:[2600,3200],n:1,  gap:.3,  dur:.20, every:[2100,1400]}
};
const VOICE_FALLBACK = {kind:"thin", f:[3000,4200], n:3, gap:.09, dur:.05, every:[2200,1400]};
const voice = k => VOICE[k] || VOICE_FALLBACK;   // a missing entry must never kill the audio
const AUDIO   = {"dollarbird": "sounds/dollarbird.m4a", "bee-eater": "sounds/bee-eater.m4a", "spotted-dove": "sounds/spotted-dove.m4a", "brambling": "sounds/brambling.m4a", "treecreeper": "sounds/treecreeper.m4a", "red-tailed-robin": "sounds/red-tailed-robin.m4a", "scops-owl": "sounds/scops-owl.m4a"};     // key -> encoded call, or absent = use the synth
const CLOSEUP = {"bee-eater-flip": "closeups/bee-eater-flip.webp", "bee-eater": "closeups/bee-eater.webp", "brambling": "closeups/brambling.webp", "dollarbird": "closeups/dollarbird.webp", "scops-owl": "closeups/scops-owl.webp", "spotted-dove": "closeups/spotted-dove.webp", "treecreeper": "closeups/treecreeper.webp"};   // key -> 700px tile centred on the bird, or absent

const A = {ctx:null,master:null,bus:null,lp:null,gain:null,pan:null,timer:0,noise:null,buf:{},prox:0};

const DEBUG = location.hash.indexOf("debug") >= 0;
async function loadVoice(key){
  if (!A.ctx || !AUDIO[key] || key in A.buf) return;
  A.buf[key] = null;
  try{
    const u = AUDIO[key];
    let ab;
    if (u.slice(0,5) === "data:"){          // inline: decode base64 in place
      const bin = atob(u.slice(u.indexOf(",")+1));
      const arr = new Uint8Array(bin.length);
      for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      ab = arr.buffer;
    } else {                                 // external file
      ab = await (await fetch(u)).arrayBuffer();
    }
    A.buf[key] = await new Promise((res,rej)=>A.ctx.decodeAudioData(ab,res,rej));
    if (DEBUG) ping("录音已载入 " + key);
  }catch(e){
    A.buf[key] = null;
    if (DEBUG) ping("录音失败 " + key + "：" + e.message);
  }
}

function initAudio(){
  if (A.ctx) return;
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  A.ctx = new C();
  A.master = A.ctx.createGain(); A.master.gain.value = .9; A.master.connect(A.ctx.destination);

  const len = A.ctx.sampleRate*3, buf = A.ctx.createBuffer(1,len,A.ctx.sampleRate), d = buf.getChannelData(0);
  let last=0; for (let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+.022*w)/1.022; d[i]=last*3.2; }
  A.noise = buf;
  const src=A.ctx.createBufferSource(); src.buffer=buf; src.loop=true;
  const lp=A.ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=520;
  const g =A.ctx.createGain(); g.gain.value=.03;
  src.connect(lp).connect(g).connect(A.master); src.start();

  A.gain = A.ctx.createGain(); A.gain.gain.value=.09;
  A.lp   = A.ctx.createBiquadFilter(); A.lp.type="lowpass"; A.lp.frequency.value=2600;
  A.pan  = A.ctx.createStereoPanner ? A.ctx.createStereoPanner() : null;
  A.bus  = A.ctx.createGain();
  A.bus.connect(A.lp).connect(A.gain);
  if (A.pan) A.gain.connect(A.pan).connect(A.master); else A.gain.connect(A.master);
  if (L) loadVoice(L.key);
}

function blip(at,f,dur,kind,amp){
  const c=A.ctx;
  if (kind==="rasp"){
    const s=c.createBufferSource(); s.buffer=A.noise; s.loop=true;
    const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=3.2; bp.frequency.value=f;
    const o=c.createOscillator(); o.type="sawtooth"; o.frequency.value=f*.5;
    const g=c.createGain();
    g.gain.setValueAtTime(.0001,at);
    g.gain.exponentialRampToValueAtTime(amp,at+.012);
    g.gain.exponentialRampToValueAtTime(.0001,at+dur);
    s.connect(bp).connect(g).connect(A.bus); o.connect(g);
    s.start(at); s.stop(at+dur+.05); o.start(at); o.stop(at+dur+.05);
    return;
  }
  const o=c.createOscillator();
  o.type = kind==="whistle" ? "sine" : kind==="roll" ? "triangle" : "sine";
  o.frequency.setValueAtTime(f,at);
  if (kind==="roll"){
    o.frequency.exponentialRampToValueAtTime(f*1.32,at+dur*.45);
    o.frequency.exponentialRampToValueAtTime(f*.92,at+dur);
  } else if (kind==="whistle"){
    o.frequency.setValueAtTime(f,at);
  } else {
    o.frequency.exponentialRampToValueAtTime(f*1.13,at+dur*.7);
  }
  const g=c.createGain();
  const rise = kind==="whistle" ? .07 : .004;
  g.gain.setValueAtTime(.0001,at);
  g.gain.exponentialRampToValueAtTime(amp,at+rise);
  g.gain.exponentialRampToValueAtTime(.0001,at+dur);
  o.connect(g).connect(A.bus); o.start(at); o.stop(at+dur+.05);
}

function sing(loud){
  if (!A.ctx) return;
  const rec = A.buf[L.key];
  if (rec){
    const v = voice(L.key), n = v.reps||1, gp = v.repGap||0, t0 = A.ctx.currentTime+.02;
    for (let i=0;i<n;i++){
      const s = A.ctx.createBufferSource(); s.buffer = rec;
      const g = A.ctx.createGain(); g.gain.value = loud ? 1.3 : 1;
      s.connect(g).connect(A.bus); s.start(t0 + i*gp);
    }
    return;
  }
  const v = voice(L.key), t = A.ctx.currentTime+.02, amp = loud?.5:.34;
  for (let i=0;i<v.n;i++){
    const f = v.f[0] + (v.f[1]-v.f[0])*(v.n<2?0:i/(v.n-1)) + (Math.random()-.5)*(v.f[1]-v.f[0])*.12;
    blip(t+i*v.gap, f, v.dur, v.kind, amp);
  }
}
function loop(){
  clearTimeout(A.timer);
  if (mode!=="search") return;
  try{ sing(false); }catch(e){ if (DEBUG) ping("发声失败："+e.message); }
  const [a,b] = voice(L.key).every;
  const k = (down ? .62 : 1) * (1 - (A.prox||0)*.62);   // calls quicken as you close in
  A.timer = setTimeout(loop, Math.max(420, (a + Math.random()*b)*k));
}

function sandFall(dur){
  if (!A.ctx) return;
  const ctx = A.ctx, sr = ctx.sampleRate, n = Math.ceil(sr*dur);
  const buf = ctx.createBuffer(1, n, sr), d = buf.getChannelData(0);
  // thousands of tiny grains, thinning out as the pile builds
  const grains = Math.round(dur*1500);
  for (let g=0; g<grains; g++){
    const t = -Math.log(1 - Math.random()*0.985) * dur*0.30;
    if (t >= dur) continue;
    const s   = Math.floor(t*sr);
    const len = Math.floor(sr*(0.0011 + Math.random()*0.0038));
    const amp = (0.25 + Math.random()*0.75) * Math.exp(-t*1.35);
    for (let i=0; i<len && s+i<n; i++){
      const e = 1 - i/len;
      d[s+i] += (Math.random()*2-1) * amp * e * e;
    }
  }
  let pk = 0; for (let i=0;i<n;i++) if (Math.abs(d[i])>pk) pk = Math.abs(d[i]);
  if (pk) for (let i=0;i<n;i++) d[i] /= pk;

  const t0 = ctx.currentTime + 0.02;
  const src = ctx.createBufferSource(); src.buffer = buf;
  const bp  = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.55;
  bp.frequency.setValueAtTime(5400, t0);
  bp.frequency.exponentialRampToValueAtTime(1300, t0+dur);   // sinks as it settles
  const hp  = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 650;
  const g   = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.075, t0+0.10);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  src.connect(bp).connect(hp).connect(g).connect(A.master);
  src.start(t0); src.stop(t0+dur+0.05);
}

/* ── main loop ─────────────────────────────────────────────── */
function frame(now){
  requestAnimationFrame(frame);
  if (mode==="boot") return;
  const el=(now-t0)/1000, spd = RM?.28:1;

  const rest = birds.filter(b=>!b.found);
  if (mode==="search" && A.ctx && rest.length){
    let best=1e9, tgt=rest[0];
    for (const b of rest){
      const d=Math.hypot(px-b.x,(py-b.y)/AR*AR*(H/W)/AR);
      if (d<best){best=d;tgt=b;}
    }
    const prox = Math.pow(Math.max(0,1-best/.5),1.5);
    A.prox = prox;
    A.gain.gain.value    = .035 + prox*prox*.965;
    A.lp.frequency.value = 900 + prox*prox*13000;
    if (A.pan) A.pan.pan.value = Math.max(-.9,Math.min(.9,(tgt.x-px)*2.6));
  }

  let pull=0;
  if (mode==="search" && rest.length){
    if (el>18) pull = Math.min(.055,(el-18)*.006);
    if (el>66) rest.forEach(b=>b.ring.classList.add("pulse"));
  }
  const cx = rest.length ? rest[0].x*W : W/2, cy = rest.length ? rest[0].y*H : H/2;

  for (const c of chars){
    if (mode==="search"){
      c.ph += .011*c.sp*spd;
      c.vx += Math.sin(c.ph*1.7)*.028*spd + Math.cos(c.ph*.6)*.014*spd;
      c.vy += Math.cos(c.ph*1.3)*.024*spd - .004*spd;
      if (pull){ c.vx += (cx-c.x)*pull*.0011; c.vy += (cy-c.y)*pull*.0011; }
      if (live){
        const dx=c.x-px*W, dy=c.y-py*H, d2=dx*dx+dy*dy;
        if (d2<9000 && d2>1){ const f=(1-d2/9000)*.6, d=Math.sqrt(d2); c.vx+=dx/d*f; c.vy+=dy/d*f; }
      }
      const s=Math.hypot(c.vx,c.vy), cap2=1.5*c.sp*spd;
      if (s>cap2){ c.vx=c.vx/s*cap2; c.vy=c.vy/s*cap2; }
      c.x+=c.vx; c.y+=c.vy; c.rot+=c.vx*.22;
      const m=60;
      if (c.x<-m) c.x=W+m; if (c.x>W+m) c.x=-m;
      if (c.y<-m) c.y=H*.92; if (c.y>H+m) c.y=-m;
      c.el.style.opacity=c.op;
      c.el.style.transform=`translate3d(${c.x.toFixed(1)}px,${c.y.toFixed(1)}px,0) rotate(${c.rot.toFixed(1)}deg) scale(${c.sc.toFixed(2)})`;
    }
    else if (mode==="settling"){
      const k=Math.max(0,Math.min(1,(el-c.delay)/1.5)), e=1-Math.pow(1-k,3);
      const x=c.sx+(c.tx-c.sx)*e, y=c.sy+(c.ty-c.sy)*e+Math.sin(e*Math.PI)*10;
      c.el.style.opacity = c.sop+(1-c.sop)*e;
      c.el.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) rotate(${(c.srot*(1-e)).toFixed(1)}deg) scale(${(c.ssc+(1-c.ssc)*e).toFixed(2)})`;
    }
  }
}

let T=[];
const clearT = () => { T.forEach(clearTimeout); T=[]; };

/* the words clear away and the photo dims evenly, then the end copy arrives */
function closeOut(){
  if (mode!=="rest") return;
  mode="closing"; clearT();
  botbar.classList.remove("show"); slot.innerHTML=""; hintline.textContent="";
  flock.style.opacity = "0";
  cap.style.opacity   = "0";
  scrim.style.opacity = "0";
  vign.style.opacity  = "0";
  scene.style.transform = "scale(1)";
  spot.style.opacity  = "0";
  photo.style.filter  = "brightness(.26) saturate(.72)";
  T.push(setTimeout(showEnd, 2400));
}
function showFlash(msg, ms){
  flash.style.top = ((L.flashY || 0.47)*100).toFixed(1)+"%";
  flash.textContent = msg; flash.classList.add("on");
  clearTimeout(window.__f);
  window.__f = setTimeout(()=>flash.classList.remove("on"), ms||2800);
}
function showEnd(){
  clearT(); mode="over"; endCard.classList.add("show");
}

/* ── states ────────────────────────────────────────────────── */
function load(key){
  L = Object.assign({key}, LEVELS[key]);
  foundSeq = 0; misses = 0;
  birds = L.birds.map(b => ({...b, found:false, seq:0}));
  photo.alt = L.cn + "，摄于野外";
  scene.style.transformOrigin = (birds[0].x*100)+"% "+(birds[0].y*100)+"%";
  vign.style.background =
    `radial-gradient(circle at ${birds[0].x*100}% ${birds[0].y*100}%,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 11%,rgba(3,7,5,.6) 44%,rgba(3,7,5,.9) 76%)`;
  introline.innerHTML = "你能找出照片里的鸟么？<br>请打开声音";
  if (TOUCH) introline.innerHTML += '<br><span style="font-size:.8em;opacity:.72">按住屏幕慢慢移动，松手确认</span>';
  L.cu = CLOSEUP[key] || null;
  spot.style.backgroundImage    = "url("+(L.cu || SRC[key])+")";
  spot.style.backgroundSize     = L.cu ? "auto" : "cover";
  spot.style.backgroundRepeat   = "no-repeat";
  spot.style.backgroundPosition = "center";
  darkOff();
  return new Promise(res => {
    photo.onload = () => { build(); res(); };
    photo.onerror = () => {
      introline.innerHTML = "图片没有加载出来。<br>请确认 levels/ 文件夹和本页在同一目录。";
      $("#enter").style.display = "none";
      res();
    };
    photo.src = SRC[key];
  });
}

function start(){
  initAudio();
  if (A.ctx && A.ctx.state==="suspended") A.ctx.resume();
  intro.style.opacity=0;
  setTimeout(()=>intro.style.display="none",1000);
  mode="search"; t0=performance.now();
  loadVoice(L.key).then(loop);
  topline.textContent = "声音 © " + L.credit;
  hintline.textContent = "";
  showShare();
  setTimeout(()=>{ topbar.classList.add("show"); botbar.classList.add("show"); },900);
}

function hitTest(){
  for (const b of birds){
    if (b.found) continue;
    const dx=(px-b.x)/b.hit[0], dy=((py-b.y)*AR)/b.hit[1];
    if (dx*dx+dy*dy <= 1) return b;
  }
  return null;
}

let foundSeq = 0, misses = 0;
function found(b){
  b.found = true; b.seq = ++foundSeq;
  b.ring.classList.remove("pulse");
  const rest = birds.filter(x=>!x.found);
  if (rest.length === 0) relight(true);
  if (rest.length){
    showFlash(rest.length===1 && birds.length>2 ? "还有一只，难为你了……" : "谁说只有一只？");
    sing(true);
    return;
  }
  allFound();
}

function allFound(){
  mode="settling"; clearTimeout(A.timer); t0=performance.now();
  chars.forEach((c,i)=>{ c.sx=c.x; c.sy=c.y; c.srot=c.rot; c.ssc=c.sc; c.sop=c.op;
                         c.delay=i*.014+Math.random()*.12; });
  topbar.style.transition = "opacity 1.6s ease";
  topbar.classList.remove("show"); botbar.classList.remove("show"); slot.innerHTML="";
  flash.classList.remove("on"); clearT();
  vign.style.opacity="1"; scene.style.transform="scale(1.1)"; scrim.style.opacity="1";
  relight(true);
  cap.innerHTML = CAPHTML(+cap.dataset.fs, L.cn, L.sci, null);
  setTimeout(()=>cap.style.opacity="1",1700);
  const settleMs = (chars.length*0.014 + 1.68)*1000;
  sandFall(settleMs/1000);
  T.push(setTimeout(()=>{
    mode="rest";
  }, settleMs));
  T.push(setTimeout(closeOut, settleMs + 5000));
}

async function again(){
  endCard.classList.remove("show");
  mode="boot"; clearT();
  await new Promise(r=>setTimeout(r,900));
  flock.innerHTML=""; flock.style.opacity="1"; cap.style.opacity="0"; cap.innerHTML="";
  scene.style.transform="scale(1)"; vign.style.opacity="0"; scrim.style.opacity="0";
  flash.classList.remove("on"); darkOff();
  photo.style.opacity="0";
  await load(pick());
  photo.style.transition="opacity 1s ease"; photo.style.opacity="1";
  slot.dataset.on="";
  mode="search"; t0=performance.now();
  loadVoice(L.key).then(loop);
  topline.textContent = "声音 © " + L.credit;
  hintline.textContent = "";
  showShare();
  topbar.classList.add("show"); botbar.classList.add("show");
}

/* ── the viewfinder ────────────────────────────────────────── */
const LOUPE = {r:0, zoom:2.3, lift:0};
function sizeLoupe(){
  LOUPE.r    = Math.round(Math.min(W*0.22, 78));
  LOUPE.lift = Math.round(LOUPE.r*1.5);
  loupe.style.width = loupe.style.height = (LOUPE.r*2)+"px";
  loupe.style.backgroundImage = "url("+SRC[L.key]+")";
  loupe.style.backgroundSize  = (W*LOUPE.zoom)+"px "+(H*LOUPE.zoom)+"px";
}
function moveLoupe(){
  const r = LOUPE.r;
  const x = Math.max(r, Math.min(W-r, px*W));
  const y = Math.max(r, Math.min(H-r, py*H - LOUPE.lift));
  loupe.style.transform = `translate3d(${x-r}px,${y-r}px,0)`;
  loupe.style.backgroundPosition =
    `${r - px*W*LOUPE.zoom}px ${r - py*H*LOUPE.zoom}px`;
}

/* ── share ─────────────────────────────────────────────────── */
function ping(msg){
  toast.textContent = msg; toast.classList.add("on");
  clearTimeout(window.__t); window.__t = setTimeout(()=>toast.classList.remove("on"), 2400);
}
function legacyCopy(s){
  const ta = document.createElement("textarea");
  ta.value = s; ta.setAttribute("readonly","");
  ta.style.cssText = "position:absolute;left:-9999px;top:0";
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, s.length);
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  return ok;
}
async function share(){
  const url  = location.href.split("#")[0];
  const text = "你能找出照片里的鸟么？";
  const msg  = text + " " + url;
  try{
    if (navigator.share){ await navigator.share({text, url}); return; }
  }catch(e){ if (e && e.name === "AbortError") return; }
  try{
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(msg); ping("链接已复制，发给鸟友"); return;
    }
  }catch(e){}
  if (legacyCopy(msg)) ping("链接已复制，发给鸟友");
  else ping(url);                       // last resort: show it so it can be copied by hand
}
function showShare(){
  slot.innerHTML = '<button class="act" id="sh">转发鸟友求助</button>';
  $("#sh").onclick = share;
}

/* ── input ─────────────────────────────────────────────────── */
function pos(e){
  const r=stage.getBoundingClientRect(), p=e.touches?e.touches[0]:e;
  px=(p.clientX-r.left)/r.width; py=(p.clientY-r.top)/r.height; live=true;
}
let down=false;
stage.addEventListener("pointermove",e=>{
  pos(e);
  if (mode==="search" && down) moveLoupe();
});
stage.addEventListener("pointerleave",()=>{ live=false; down=false; loupe.classList.remove("on"); });
stage.addEventListener("pointerdown",e=>{
  if (A.ctx && A.ctx.state !== "running") A.ctx.resume();
  if (mode==="rest"){ closeOut(); return; }
  if (mode==="closing"){ showEnd(); return; }
  if (mode!=="search") return;
  down=true; pos(e); sizeLoupe(); moveLoupe();
  loupe.classList.add("on");
  stage.setPointerCapture && stage.setPointerCapture(e.pointerId);
  clearTimeout(A.timer); sing(false); loop();          // answer straight away
});
stage.addEventListener("pointerup",e=>{
  if (!down) return;
  down=false; loupe.classList.remove("on");
  if (mode!=="search") return;
  pos(e);
  const b=hitTest();
  if (b) found(b);
  else{
    misses++;
    if      (misses === 1) showFlash("声音越响，你离它越近", 2600);
    else if (misses === 2) showFlash("不在这里，再听听", 2400);
    else if (L.missAt && misses === L.missAt) showFlash(L.missMsg, 3400);
  }
});
stage.addEventListener("pointercancel",()=>{ down=false; loupe.classList.remove("on"); });
$("#enter").onclick = start;
$("#again").onclick  = again;
$("#share2").onclick = share;
// anywhere on the end page other than the two links opens the book
const BUY = "https://3.cn/329-RopB?jkl=@R5j4s3Ph7u5@";
endCard.addEventListener("click", e => {
  if (e.target.closest("#share2, #again")) return;
  window.open(BUY, "_blank", "noopener");
});
$("#share2").addEventListener("click", e => e.stopPropagation());
$("#again").addEventListener("click", e => e.stopPropagation());

document.addEventListener("visibilitychange",()=>{
  if (!document.hidden && A.ctx && A.ctx.state !== "running") A.ctx.resume();
});
let rz; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{
  if (mode==="search"){ build(); if (down) sizeLoupe(); }
  if (birds.some(b=>b.found)) relight(birds.every(b=>b.found));
},220); });

(async () => {
  await load(pick());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
  requestAnimationFrame(frame);
})();
})();
</script>
